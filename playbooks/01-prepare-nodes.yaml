---
- name: Подготовка всех узлов к установке Kubernetes с Docker
  hosts: all
  become: yes
  vars:
    # Версия Kubernetes для установки
    kubernetes_version: "1.36"
    # Версия cri-dockerd. Уточните актуальную на https://github.com/Mirantis/cri-dockerd/releases
    cri_dockerd_version: "0.4.3"

  tasks:
    # 1. ПРЕДВАРИТЕЛЬНАЯ НАСТРОЙКА ОС
    - name: Отключить swap
      shell: swapoff -a

    - name: Убрать swap из fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '#\1'

    - name: Обеспечить наличие localhost в /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
        state: present
      loop:
        - "127.0.0.1 localhost"
        - "::1       localhost"

    - name: Загрузить модули ядра (конфиг)
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Применить модули ядра
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Настроить параметры ядра
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables=1
          net.bridge.bridge-nf-call-ip6tables=1
          net.ipv4.ip_forward=1

    - name: Применить параметры ядра
      command: sysctl --system

    # 2. УСТАНОВКА БАЗОВЫХ ЗАВИСИМОСТЕЙ
    - name: Установить необходимые системные пакеты
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
        state: present
        update_cache: yes

    # 3. УСТАНОВКА DOCKER
    - name: Создать директорию для ключей apt
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Добавить официальный GPG-ключ Docker
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Определить архитектуру
      set_fact:
        docker_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"

    - name: Добавить репозиторий Docker
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        mode: '0644'

    - name: Обновить кэш apt и установить Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Запустить и включить Docker
      systemd:
        name: docker
        state: started
        enabled: yes
        daemon_reload: yes

    # 4. УСТАНОВКА CRI-DOCKERD
    - name: Скачать и установить cri-dockerd
      block:
        - name: Скачать архив cri-dockerd
          get_url:
            url: "https://github.com/Mirantis/cri-dockerd/releases/download/v{{ cri_dockerd_version }}/cri-dockerd-{{ cri_dockerd_version }}.amd64.tgz"
            dest: "/tmp/cri-dockerd-{{ cri_dockerd_version }}.amd64.tgz"

        - name: Распаковать cri-dockerd
          unarchive:
            src: "/tmp/cri-dockerd-{{ cri_dockerd_version }}.amd64.tgz"
            dest: /tmp
            remote_src: yes

        - name: Переместить исполняемый файл cri-dockerd
          copy:
            src: "/tmp/cri-dockerd/cri-dockerd"
            dest: /usr/local/bin/cri-dockerd
            mode: '0755'
            remote_src: yes

        - name: Очистить временные файлы
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/cri-dockerd-{{ cri_dockerd_version }}.amd64.tgz"
            - /tmp/cri-dockerd

    - name: Настроить systemd-сервис для cri-dockerd
      copy:
        dest: /etc/systemd/system/cri-docker.service
        content: |
          [Unit]
          Description=CRI Interface for Docker Application Container Engine
          Documentation=https://docs.mirantis.com
          After=network-online.target firewalld.service docker.service
          Wants=network-online.target
          Requires=cri-docker.socket

          [Service]
          Type=notify
          ExecStart=/usr/local/bin/cri-dockerd --container-runtime-endpoint fd://
          ExecReload=/bin/kill -s HUP $MAINPID
          TimeoutStopSec=120
          RestartSec=5
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Настроить systemd-сокет для cri-dockerd
      copy:
        dest: /etc/systemd/system/cri-docker.socket
        content: |
          [Unit]
          Description=CRI Docker Socket
          PartOf=cri-docker.service

          [Socket]
          ListenStream=%t/cri-dockerd.sock
          SocketMode=0660
          SocketUser=root
          SocketGroup=docker

          [Install]
          WantedBy=sockets.target

    - name: Перезапустить systemd, запустить и включить cri-dockerd
      systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
        daemon_reload: yes
      loop:
        - cri-docker.socket
        - cri-docker.service

    # 5. УСТАНОВКА КОМПОНЕНТОВ KUBERNETES
    - name: Удалить старые репозитории Kubernetes
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/kubernetes.list
        - /etc/apt/sources.list.d/deb.nodesource.com_node_12.x.list 
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Скачать GPG-ключ репозитория Kubernetes
      shell: >
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key
        | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Добавить репозиторий Kubernetes
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /
        mode: '0644'

    - name: Обновить кэш apt и установить компоненты Kubernetes
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present
        update_cache: yes

    - name: Зафиксировать версии пакетов Kubernetes
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Включить kubelet (без запуска — он стартует после kubeadm init/join)
      systemd:
        name: kubelet
        enabled: yes