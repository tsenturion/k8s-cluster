################################################################################
# Назначение:
#   Инициализация fresh single-master Kubernetes-кластера на master1.
#
# Когда запускать:
#   После полной очистки и common/01-prepare-nodes.yaml, до подключения worker-ов.
#   Это основной init playbook для топологии master1 + worker1 + worker2.
#
# Что делает:
#   Проверяет CRI socket выбранного runtime, выполняет kubeadm init на IP master1, готовит
#   kubeconfig для пользователя admin, ставит Calico operator и применяет Calico
#   Installation с controlPlaneReplicas=1, чтобы не создавать лишнюю нагрузку.
#
# Важно:
#   По умолчанию master1 остается dedicated control-plane с NoSchedule taint.
#   Для настоящего all-in-one режима можно передать allow_workloads_on_master=true.
################################################################################
---
- name: Инициализация single-master Kubernetes на master1
  hosts: master1
  become: true

  vars:
    apiserver_advertise_address: "192.168.0.33"
    pod_network_cidr: "10.244.0.0/16"
    service_cidr: "10.96.0.0/12"
    container_runtime: "containerd"
    containerd_cri_socket: "unix:///run/containerd/containerd.sock"
    containerd_cri_socket_path: "/run/containerd/containerd.sock"
    docker_cri_socket: "unix:///run/cri-dockerd.sock"
    docker_cri_socket_path: "/run/cri-dockerd.sock"
    cri_socket: "{{ docker_cri_socket if container_runtime == 'docker' else containerd_cri_socket }}"
    cri_socket_path: "{{ docker_cri_socket_path if container_runtime == 'docker' else containerd_cri_socket_path }}"
    kube_user: "admin"
    calico_version: "v3.32.0"
    calico_interface: "enp0s8"
    calico_control_plane_replicas: 1
    allow_workloads_on_master: false

  tasks:
    - name: Проверить выбранный container runtime
      assert:
        that:
          - container_runtime in ['containerd', 'docker']
        fail_msg: "container_runtime должен быть containerd или docker."

    - name: Проверить наличие CRI socket выбранного runtime
      stat:
        path: "{{ cri_socket_path }}"
      register: cri_socket_file

    - name: Завершить с ошибкой, если CRI socket отсутствует
      fail:
        msg: "CRI socket {{ cri_socket_path }} для container_runtime={{ container_runtime }} не найден"
      when: not cri_socket_file.stat.exists

    - name: Проверить, инициализирован ли уже кластер
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Загрузить образы Kubernetes
      command: >
        kubeadm config images pull
        --cri-socket {{ cri_socket }}
      when: not k8s_admin_conf.stat.exists

    - name: Инициализировать single-master кластер
      command: >
        kubeadm init
        --apiserver-advertise-address {{ apiserver_advertise_address }}
        --pod-network-cidr {{ pod_network_cidr }}
        --service-cidr {{ service_cidr }}
        --cri-socket {{ cri_socket }}
      register: kubeadm_init
      when: not k8s_admin_conf.stat.exists

    - name: Создать директорию .kube для admin
      file:
        path: "/home/{{ kube_user }}/.kube"
        state: directory
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: "0755"

    - name: Скопировать kubeconfig для admin
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ kube_user }}/.kube/config"
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: "0600"
        remote_src: true

    - name: Ожидать готовности API-сервера
      command: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
      register: kubectl_result
      until: kubectl_result.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Установить оператор Calico
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        apply -f
        https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml

    - name: Ожидать регистрации CRD Installation
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get crd installations.operator.tigera.io
      register: crd_ready
      until: crd_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Применить конфигурацию Calico Installation
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f -
      args:
        stdin: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            controlPlaneReplicas: {{ calico_control_plane_replicas }}
            calicoNetwork:
              nodeAddressAutodetectionV4:
                interface: {{ calico_interface }}
              ipPools:
                - blockSize: 26
                  cidr: {{ pod_network_cidr }}
                  encapsulation: VXLANCrossSubnet
                  natOutgoing: Enabled
                  nodeSelector: all()
          ---
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}

    - name: Разрешить запуск pod-ов на master1
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        taint nodes master1 node-role.kubernetes.io/control-plane- --overwrite
      failed_when: false
      changed_when: false
      when: allow_workloads_on_master

    - name: Оставить master1 только для control-plane
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        taint nodes master1 node-role.kubernetes.io/control-plane=:NoSchedule --overwrite
      register: master_taint
      changed_when: "'tainted' in master_taint.stdout or 'modified' in master_taint.stdout"
      when: not allow_workloads_on_master

    - name: Ожидать Ready master1
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        wait node/master1
        --for=condition=Ready
        --timeout=600s
      changed_when: false

    - name: Показать узлы
      command: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide
      register: nodes_output
      changed_when: false

    - name: Вывести узлы
      debug:
        var: nodes_output.stdout_lines
