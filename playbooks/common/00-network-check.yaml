################################################################################
# Назначение:
#   Быстрая сетевая диагностика всех узлов из выбранного inventory.
#
# Когда запускать:
#   Перед подготовкой узлов и перед kubeadm init/join, чтобы убедиться, что
#   Ansible видит все машины, а интерфейс enp0s8 имеет ожидаемые IP/MAC.
#
# Что делает:
#   Собирает facts, читает MAC и IPv4 адрес интерфейса enp0s8, выводит их в
#   удобном виде. Playbook ничего не настраивает и не меняет на узлах.
#
# Важно:
#   Если на ВМ используется другой host-only/LAN интерфейс, нужно заменить enp0s8
#   в задачах или привести netplan ВМ к ожидаемой схеме.
################################################################################
---
- name: Сетевая диагностика кластера
  hosts: all
  gather_facts: yes
  become: yes
  
  tasks:
    - name: Получить MAC и IP для enp0s8
      set_fact:
        mac: "{{ ansible_facts['enp0s8']['macaddress'] }}"
        ip: "{{ ansible_facts['enp0s8']['ipv4']['address'] }}"

    - name: Вывод в формате для резервирования
      debug:
        msg: "{{ inventory_hostname }} | MAC: {{ mac }} | IP: {{ ip }}"
