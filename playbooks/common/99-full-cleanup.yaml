################################################################################
# Назначение:
#   Полная очистка Kubernetes-узлов перед установкой кластера с нуля.
#
# Когда запускать:
#   Когда нужно гарантированно убрать старый кластер, CNI, kubelet state,
#   Kubernetes-пакеты и начать fresh install. Подходит для single-master и
#   multinode inventory.
#
# Что делает:
#   Останавливает kubelet/runtime, размонтирует kubelet mountpoints, чистит
#   контейнеры, выполняет kubeadm reset, удаляет Kubernetes/CNI директории,
#   чистит iptables, снимает hold с Kubernetes-пакетов, удаляет kubeadm/kubelet/
#   kubectl/kubernetes-cni и перезагружает узлы.
#
# Важно:
#   Это разрушительный playbook. После него обязательно снова запускать
#   common/01-prepare-nodes.yaml перед init/join.
#   Повторный запуск после уже выполненной очистки допустим: playbook проверяет
#   наличие kubelet/kubeadm и не считает их отсутствие ошибкой.
#   Если ВМ реально перезагрузилась, но Ansible не дождался SSH/boot-time check,
#   проверьте консоль VirtualBox. Для зависшей ВМ можно использовать служебный
#   playbooks/_operator/09-reset-vm-wait-ssh.yaml.
################################################################################
---
- name: Полная очистка Kubernetes кластера
  hosts: all
  become: yes

  vars:
    cleanup_reboot_timeout: 1200
    cleanup_reboot_connect_timeout: 10
    cleanup_reboot_pre_delay: 5
    cleanup_reboot_post_delay: 30
    cleanup_reboot_test_command: "whoami"

  tasks:

    - name: Собрать список systemd сервисов
      service_facts:

    - name: Проверить наличие kubeadm
      stat:
        path: /usr/bin/kubeadm
      register: kubeadm_binary

    - name: Остановка kubelet
      systemd:
        name: kubelet
        state: stopped
        enabled: no
      when: "'kubelet.service' in ansible_facts.services"

    - name: Остановка контейнерных рантаймов
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker
        - containerd
        - cri-docker
      when: (item ~ '.service') in ansible_facts.services
      ignore_errors: yes

    - name: Принудительная размонтирование точек монтирования kubelet
      shell: |
        mount | grep /var/lib/kubelet | awk '{print $3}' | xargs -r umount -f
      ignore_errors: yes

    - name: Очистка запущенных контейнеров (docker)
      shell: |
        docker ps -aq | xargs -r docker rm -f
      ignore_errors: yes

    - name: Очистка запущенных контейнеров (containerd)
      shell: |
        crictl ps -aq | xargs -r crictl rm -f
      ignore_errors: yes

    - name: Убить процессы kubelet и связанные
      shell: |
        pkill -9 kubelet || true
        pkill -9 kube-proxy || true
        pkill -9 containerd-shim || true
      ignore_errors: yes

    - name: kubeadm reset с указанием CRI (containerd)
      command: kubeadm reset -f --cri-socket=unix:///var/run/containerd/containerd.sock
      when: kubeadm_binary.stat.exists
      ignore_errors: yes

    - name: Альтернативный kubeadm reset (cri-dockerd если нужен)
      command: kubeadm reset -f --cri-socket=unix:///var/run/cri-dockerd.sock
      when: kubeadm_binary.stat.exists
      ignore_errors: yes

    - name: Повторная остановка kubelet после reset
      systemd:
        name: kubelet
        state: stopped
      when: "'kubelet.service' in ansible_facts.services"

    - name: Удаление Kubernetes директорий
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/kubelet
        - /var/lib/etcd
        - /etc/cni
        - /var/lib/cni
        - /opt/cni
        - /var/lib/kube-proxy
        - /var/lib/kube-scheduler
        - /var/lib/kube-controller-manager
        - /var/lib/kubelet-plugins
        - /var/lib/kubelet-plugins-volume
        - /var/lib/kubelet-volume
      ignore_errors: yes

    - name: Очистка Calico интерфейсов
      shell: |
        for i in $(ip -o link show | awk -F': ' '{print $2}' | grep -E '^cali|cni0|tunl0|flannel|veth|docker|br-'); do
          ip link delete $i 2>/dev/null || true
        done
      ignore_errors: yes

    - name: Очистка iptables правил
      shell: |
        iptables -F
        iptables -t nat -F
        iptables -t mangle -F
        iptables -X
        iptables -t nat -X
        iptables -t mangle -X
        ip6tables -F
        ip6tables -t nat -F
        ip6tables -t mangle -F
        ip6tables -X
      ignore_errors: yes

    - name: Очистка bridge network
      shell: |
        ip link delete docker0 2>/dev/null || true
        ip link delete cni0 2>/dev/null || true
      ignore_errors: yes

    - name: Удаление конфигурационных файлов
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /root/.kube
        - /home/*/.kube
        - /etc/cni/net.d
        - /opt/cni/bin
        - /var/log/pods
        - /var/log/containers
      ignore_errors: yes

    - name: Снять hold с Kubernetes пакетов
      shell: |
        apt-mark unhold kubeadm kubelet kubectl kubernetes-cni
      ignore_errors: yes

    - name: Удаление пакетов Kubernetes
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
          - kubernetes-cni
        state: absent
        purge: yes
        allow_change_held_packages: yes
      ignore_errors: yes

    - name: Очистка кэша apt
      apt:
        autoremove: yes
        autoclean: yes
      ignore_errors: yes

    - name: Перезагрузка узла
      reboot:
        reboot_timeout: "{{ cleanup_reboot_timeout }}"
        connect_timeout: "{{ cleanup_reboot_connect_timeout }}"
        pre_reboot_delay: "{{ cleanup_reboot_pre_delay }}"
        post_reboot_delay: "{{ cleanup_reboot_post_delay }}"
        test_command: "{{ cleanup_reboot_test_command }}"
      register: cleanup_reboot
      ignore_errors: yes

    - name: Диагностика не подтвержденной перезагрузки
      debug:
        msg:
          - "Ansible не смог подтвердить перезагрузку {{ inventory_hostname }} за {{ cleanup_reboot_timeout }} секунд."
          - "Если rebooted=true, ВМ получила команду reboot, но SSH/boot-time check не вернулся вовремя."
          - "Проверьте консоль VirtualBox и сетевую доступность узла."
          - "Для зависшей ВМ можно использовать playbooks/_operator/09-reset-vm-wait-ssh.yaml с target_vm/target_host."
      when:
        - cleanup_reboot is failed
