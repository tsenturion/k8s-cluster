################################################################################
# Назначение:
#   Базовая подготовка Ubuntu-узлов к Kubernetes с выбранным container runtime.
#
# Когда запускать:
#   После полной очистки или на свежих ВМ, до любых kubeadm init/join playbook-ов.
#   Один и тот же playbook используется для single-master и multinode топологий.
#
# Что делает:
#   Настраивает hostname, отключает swap, правит /etc/hosts, включает нужные
#   kernel modules/sysctl, ставит containerd по умолчанию или Docker +
#   cri-dockerd при явном выборе, затем kubeadm, kubelet, kubectl и cri-tools,
#   фиксирует версии Kubernetes-пакетов через hold.
#
# Важно:
#   Playbook меняет системную конфигурацию и требует sudo. Kubernetes version,
#   container runtime и cri-dockerd version задаются в vars внутри файла.
#   Ошибка на любом узле останавливает весь playbook, чтобы кластер не оказался
#   частично подготовленным.
#   Сетевые apt-операции выполняются с ограничением параллельности, потому что
#   одновременная загрузка пакетов на 5 ВМ в lab-сети часто дает timeout.
#   Kubernetes-пакеты ставятся последовательно по узлам; для повторного запуска
#   только этого этапа можно использовать tag kubernetes.
#   По умолчанию Kubernetes apt repository берется с Yandex mirror. Чтобы
#   использовать официальный pkgs.k8s.io, передайте:
#   -e kubernetes_repo_source=official
#   По умолчанию используется containerd. Чтобы использовать прежний вариант
#   Docker + cri-dockerd, передайте:
#   -e container_runtime=docker
################################################################################
---
- name: Подготовка всех узлов к установке Kubernetes
  hosts: all
  become: yes
  any_errors_fatal: true
  vars:
    # Версия Kubernetes для установки
    kubernetes_version: "1.36"
    # Container runtime: containerd или docker. docker означает Docker + cri-dockerd.
    container_runtime: "containerd"
    containerd_cri_socket: "unix:///run/containerd/containerd.sock"
    containerd_cri_socket_path: "/run/containerd/containerd.sock"
    docker_cri_socket: "unix:///run/cri-dockerd.sock"
    docker_cri_socket_path: "/run/cri-dockerd.sock"
    cri_socket: "{{ docker_cri_socket if container_runtime == 'docker' else containerd_cri_socket }}"
    cri_socket_path: "{{ docker_cri_socket_path if container_runtime == 'docker' else containerd_cri_socket_path }}"
    # Источник Kubernetes apt repository: yandex или official
    kubernetes_repo_source: "yandex"
    kubernetes_repo_yandex_url: "https://mirror.yandex.ru/mirrors/pkgs.k8s.io/core/stable/v{{ kubernetes_version }}"
    kubernetes_repo_official_url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}"
    kubernetes_repo_base_url: "{{ kubernetes_repo_official_url if kubernetes_repo_source == 'official' else kubernetes_repo_yandex_url }}"
    # Версия cri-dockerd. Уточните актуальную на https://github.com/Mirantis/cri-dockerd/releases
    cri_dockerd_version: "0.4.3"
    cri_dockerd_arch: "amd64"
    cri_dockerd_archive: "cri-dockerd-{{ cri_dockerd_version }}.{{ cri_dockerd_arch }}.tgz"
    cri_dockerd_url: "https://github.com/Mirantis/cri-dockerd/releases/download/v{{ cri_dockerd_version }}/{{ cri_dockerd_archive }}"
    cri_dockerd_local_cache_dir: "/tmp/k8s-cluster-cache"
    cri_dockerd_local_archive: "{{ cri_dockerd_local_cache_dir }}/{{ cri_dockerd_archive }}"
    cri_dockerd_remote_archive: "/tmp/{{ cri_dockerd_archive }}"

  tasks:
    - name: Проверить выбранный container runtime
      assert:
        that:
          - container_runtime in ['containerd', 'docker']
        fail_msg: "container_runtime должен быть containerd или docker."

    - name: Показать выбранный container runtime
      debug:
        msg: "Container runtime={{ container_runtime }}, CRI socket={{ cri_socket }}"

    # 1. ПРЕДВАРИТЕЛЬНАЯ НАСТРОЙКА ОС
    - name: Установить hostname согласно inventory
      hostname:
        name: "{{ inventory_hostname }}"
        use: systemd

    - name: Отключить swap
      shell: swapoff -a

    - name: Убрать swap из fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '#\1'

    - name: Обеспечить наличие localhost в /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
        state: present
      loop:
        - "127.0.0.1 localhost"
        - "::1       localhost"

    - name: Добавить все узлы кластера в /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_host }} {{ item }}"
        state: present
      loop: "{{ groups['all'] }}"

    - name: Загрузить модули ядра (конфиг)
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Применить модули ядра
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Настроить параметры ядра
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables=1
          net.bridge.bridge-nf-call-ip6tables=1
          net.ipv4.ip_forward=1

    - name: Применить параметры ядра
      command: sysctl --system

    # 2. УСТАНОВКА БАЗОВЫХ ЗАВИСИМОСТЕЙ
    - name: Установить необходимые системные пакеты
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - conntrack
          - software-properties-common
        state: present
        update_cache: yes
        lock_timeout: 300
      throttle: 1
      tags:
        - base_packages

    # 3. УСТАНОВКА CONTAINERD ИЛИ DOCKER + CRI-DOCKERD
    - name: Создать директорию для ключей apt
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Установить containerd
      apt:
        name:
          - containerd
        state: present
        update_cache: yes
        lock_timeout: 600
      register: containerd_install
      retries: 3
      delay: 30
      until: containerd_install is succeeded
      throttle: 1
      when: container_runtime == 'containerd'
      tags:
        - container_runtime
        - containerd

    - name: Создать директорию конфигурации containerd
      file:
        path: /etc/containerd
        state: directory
        mode: "0755"
      when: container_runtime == 'containerd'
      tags:
        - container_runtime
        - containerd

    - name: Получить default-конфигурацию containerd
      command: containerd config default
      register: containerd_default_config
      changed_when: false
      when: container_runtime == 'containerd'
      tags:
        - container_runtime
        - containerd

    - name: Настроить containerd для Kubernetes с systemd cgroups
      copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
        mode: "0644"
      register: containerd_config
      when: container_runtime == 'containerd'
      tags:
        - container_runtime
        - containerd

    - name: Запустить и включить containerd
      systemd:
        name: containerd
        state: "{{ 'restarted' if (containerd_config.changed | default(false)) else 'started' }}"
        enabled: yes
        daemon_reload: yes
      when: container_runtime == 'containerd'
      tags:
        - container_runtime
        - containerd

    - name: Добавить официальный GPG-ключ Docker
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Определить архитектуру
      set_fact:
        docker_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Добавить репозиторий Docker
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        mode: '0644'
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Обновить кэш apt и установить Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
        lock_timeout: 600
      register: docker_install
      retries: 3
      delay: 30
      until: docker_install is succeeded
      throttle: 1
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Запустить и включить Docker
      systemd:
        name: docker
        state: started
        enabled: yes
        daemon_reload: yes
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Создать локальный cache для cri-dockerd на ansible-controller
      file:
        path: "{{ cri_dockerd_local_cache_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Скачать архив cri-dockerd на ansible-controller
      get_url:
        url: "{{ cri_dockerd_url }}"
        dest: "{{ cri_dockerd_local_archive }}"
        mode: "0644"
        timeout: 60
        force: false
      register: cri_dockerd_download
      retries: 5
      delay: 15
      until: cri_dockerd_download is succeeded
      delegate_to: localhost
      become: false
      run_once: true
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Скачать и установить cri-dockerd
      block:
        - name: Скопировать архив cri-dockerd на узел
          copy:
            src: "{{ cri_dockerd_local_archive }}"
            dest: "{{ cri_dockerd_remote_archive }}"
            mode: "0644"

        - name: Распаковать cri-dockerd
          unarchive:
            src: "{{ cri_dockerd_remote_archive }}"
            dest: /tmp
            remote_src: yes

        - name: Переместить исполняемый файл cri-dockerd
          copy:
            src: "/tmp/cri-dockerd/cri-dockerd"
            dest: /usr/local/bin/cri-dockerd
            mode: '0755'
            remote_src: yes

        - name: Очистить временные файлы
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ cri_dockerd_remote_archive }}"
            - /tmp/cri-dockerd
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Настроить systemd-сервис для cri-dockerd
      copy:
        dest: /etc/systemd/system/cri-docker.service
        content: |
          [Unit]
          Description=CRI Interface for Docker Application Container Engine
          Documentation=https://docs.mirantis.com
          After=network-online.target firewalld.service docker.service
          Wants=network-online.target
          Requires=cri-docker.socket

          [Service]
          Type=notify
          ExecStart=/usr/local/bin/cri-dockerd --container-runtime-endpoint fd://
          ExecReload=/bin/kill -s HUP $MAINPID
          TimeoutStopSec=120
          RestartSec=5
          Restart=always

          [Install]
          WantedBy=multi-user.target
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Настроить systemd-сокет для cri-dockerd
      copy:
        dest: /etc/systemd/system/cri-docker.socket
        content: |
          [Unit]
          Description=CRI Docker Socket
          PartOf=cri-docker.service

          [Socket]
          ListenStream=%t/cri-dockerd.sock
          SocketMode=0660
          SocketUser=root
          SocketGroup=docker

          [Install]
          WantedBy=sockets.target
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    - name: Перезапустить systemd, запустить и включить cri-dockerd
      systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
        daemon_reload: yes
      loop:
        - cri-docker.socket
        - cri-docker.service
      when: container_runtime == 'docker'
      tags:
        - container_runtime
        - docker

    # 4. УСТАНОВКА КОМПОНЕНТОВ KUBERNETES
    - name: Проверить выбранный источник Kubernetes repository
      assert:
        that:
          - kubernetes_repo_source in ['yandex', 'official']
        fail_msg: "kubernetes_repo_source должен быть yandex или official."
      tags:
        - kubernetes

    - name: Показать выбранный источник Kubernetes repository
      debug:
        msg: "Kubernetes repository source={{ kubernetes_repo_source }}, url={{ kubernetes_repo_base_url }}/deb/"
      tags:
        - kubernetes

    - name: Удалить старые репозитории Kubernetes
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/kubernetes.list
        - /etc/apt/sources.list.d/deb.nodesource.com_node_12.x.list 
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      tags:
        - kubernetes

    - name: Скачать GPG-ключ репозитория Kubernetes
      shell: >
        curl -fsSL {{ kubernetes_repo_base_url }}/deb/Release.key
        | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      tags:
        - kubernetes

    - name: Добавить репозиторий Kubernetes
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ kubernetes_repo_base_url }}/deb/ /
        mode: '0644'
      tags:
        - kubernetes

    - name: Обновить кэш apt перед установкой компонентов Kubernetes
      apt:
        update_cache: yes
        cache_valid_time: 0
        lock_timeout: 600
      register: k8s_apt_cache
      retries: 3
      delay: 30
      until: k8s_apt_cache is succeeded
      throttle: 1
      tags:
        - kubernetes

    - name: Установить компоненты Kubernetes
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
          - cri-tools
        state: present
        update_cache: no
        lock_timeout: 600
      register: k8s_install
      retries: 3
      delay: 30
      until: k8s_install is succeeded
      throttle: 1
      tags:
        - kubernetes

    - name: Зафиксировать версии пакетов Kubernetes
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl
        - cri-tools
      tags:
        - kubernetes

    - name: Включить kubelet (без запуска — он стартует после kubeadm init/join)
      systemd:
        name: kubelet
        enabled: yes
      tags:
        - kubernetes

    - name: Настроить crictl на выбранный CRI endpoint
      copy:
        dest: /etc/crictl.yaml
        content: |
          runtime-endpoint: {{ cri_socket }}
          image-endpoint: {{ cri_socket }}
          timeout: 10
          debug: false
        mode: "0644"
      tags:
        - container_runtime
        - kubernetes

    - name: Дождаться CRI socket выбранного runtime
      wait_for:
        path: "{{ cri_socket_path }}"
        timeout: 60
      tags:
        - container_runtime
        - kubernetes

    - name: Проверить CRI выбранного runtime
      command: crictl --runtime-endpoint {{ cri_socket }} info
      register: cri_ready
      changed_when: false
      retries: 12
      delay: 5
      until: cri_ready.rc == 0
      tags:
        - container_runtime
        - kubernetes
