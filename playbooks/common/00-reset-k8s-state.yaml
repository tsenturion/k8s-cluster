################################################################################
# Назначение:
#   Мягкий сброс Kubernetes-состояния перед повторной установкой, без удаления
#   установленных пакетов container runtime, kubeadm, kubelet и kubectl.
#
# Когда запускать:
#   Когда нужно переинициализировать кластер поверх уже подготовленных узлов,
#   но нет необходимости заново ставить системные пакеты. Подходит и для
#   single-master, и для multinode inventory.
#
# Что делает:
#   Останавливает kubelet, выполняет kubeadm reset, удаляет Kubernetes/etcd/CNI
#   состояние, старые join-скрипты, CNI интерфейсы, iptables/IPVS правила и
#   старые keepalived конфиги, если reset_keepalived=true.
#
# Важно:
#   Это изменяющий playbook. После него кластер считается разобранным, но пакеты
#   остаются на узлах, поэтому следующим шагом обычно идет init нужной топологии.
################################################################################
---
- name: Сброс Kubernetes-состояния перед новой установкой
  hosts: all
  become: true
  gather_facts: false
  ignore_unreachable: true

  vars:
    kube_user: "admin"
    container_runtime: "containerd"
    containerd_cri_socket: "unix:///run/containerd/containerd.sock"
    docker_cri_socket: "unix:///run/cri-dockerd.sock"
    cri_socket: "{{ docker_cri_socket if container_runtime == 'docker' else containerd_cri_socket }}"
    reset_keepalived: true
    reset_iptables: true

  tasks:
    - name: Проверить выбранный container runtime
      assert:
        that:
          - container_runtime in ['containerd', 'docker']
        fail_msg: "container_runtime должен быть containerd или docker."

    - name: Остановить kubelet
      systemd:
        name: kubelet
        state: stopped
      failed_when: false

    - name: Выполнить kubeadm reset
      command: >
        kubeadm reset -f
        --cri-socket {{ cri_socket }}
      register: kubeadm_reset_result
      failed_when: false
      changed_when: true

    - name: Остановить и отключить keepalived
      systemd:
        name: keepalived
        state: stopped
        enabled: false
      failed_when: false
      when: reset_keepalived

    - name: Удалить конфиги keepalived
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/keepalived/keepalived.conf
        - /etc/keepalived/check_apiserver.sh
      when: reset_keepalived

    - name: Удалить Kubernetes / etcd / CNI состояние
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/etcd
        - /var/lib/kubelet
        - /var/lib/cni
        - /etc/cni/net.d
        - /var/run/kubernetes
        - /root/.kube
        - "/home/{{ kube_user }}/.kube"
        - /tmp/worker_join.sh
        - /tmp/controlplane_join.sh

    - name: Удалить старые CNI интерфейсы
      command: ip link delete {{ item }}
      loop:
        - cni0
        - flannel.1
        - tunl0
        - vxlan.calico
        - kube-ipvs0
      failed_when: false
      changed_when: false

    - name: Очистить iptables IPv4
      shell: |
        iptables -F || true
        iptables -t nat -F || true
        iptables -t mangle -F || true
        iptables -X || true
      when: reset_iptables
      failed_when: false
      changed_when: true

    - name: Очистить iptables IPv6
      shell: |
        ip6tables -F || true
        ip6tables -t nat -F || true
        ip6tables -t mangle -F || true
        ip6tables -X || true
      when: reset_iptables
      failed_when: false
      changed_when: true

    - name: Очистить IPVS если используется
      command: ipvsadm --clear
      failed_when: false
      changed_when: false

    - name: Перезапустить containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true
      failed_when: false
      when: container_runtime == 'containerd'

    - name: Перезапустить Docker
      systemd:
        name: docker
        state: restarted
        enabled: true
      failed_when: false
      when: container_runtime == 'docker'

    - name: Перезапустить cri-docker.socket
      systemd:
        name: cri-docker.socket
        state: restarted
        enabled: true
        daemon_reload: true
      failed_when: false
      when: container_runtime == 'docker'

    - name: Перезапустить cri-docker.service
      systemd:
        name: cri-docker.service
        state: restarted
        enabled: true
        daemon_reload: true
      failed_when: false
      when: container_runtime == 'docker'

    - name: Включить kubelet, но не запускать до kubeadm init
      systemd:
        name: kubelet
        enabled: true
        state: stopped
      failed_when: false

    - name: Итог
      debug:
        msg:
          - "Сброс Kubernetes-состояния завершён на {{ inventory_hostname }}"
          - "container_runtime={{ container_runtime }}, CRI socket={{ cri_socket }}"
          - "Container runtime/kubeadm/kubelet/kubectl не удалялись"
          - "Теперь можно запускать init для нужной топологии"
