################################################################################
# Назначение:
#   Инициализация первого control-plane узла HA/multinode Kubernetes-кластера.
#
# Когда запускать:
#   В multinode сценарии после common/01-prepare-nodes.yaml и настройки
#   keepalived VIP. Этот playbook запускается только на master1.
#
# Что делает:
#   Проверяет CRI socket выбранного runtime, выполняет kubeadm init с
#   --control-plane-endpoint на VIP, готовит kubeconfig для пользователя admin,
#   генерирует worker/control-plane join scripts и устанавливает Calico.
#
# Важно:
#   control_plane_endpoint должен указывать на работающий VIP. Для single-master
#   используется другой playbook: playbooks/singlenode/03-init-single-master.yaml.
################################################################################
---
- name: Инициализация первого управляющего узла Kubernetes (control-plane)
  hosts: master1
  become: true

  vars:
    control_plane_endpoint: "192.168.0.100:6443"
    pod_network_cidr: "10.244.0.0/16"
    service_cidr: "10.96.0.0/12"
    container_runtime: "containerd"
    containerd_cri_socket: "unix:///run/containerd/containerd.sock"
    containerd_cri_socket_path: "/run/containerd/containerd.sock"
    docker_cri_socket: "unix:///run/cri-dockerd.sock"
    docker_cri_socket_path: "/run/cri-dockerd.sock"
    cri_socket: "{{ docker_cri_socket if container_runtime == 'docker' else containerd_cri_socket }}"
    cri_socket_path: "{{ docker_cri_socket_path if container_runtime == 'docker' else containerd_cri_socket_path }}"
    kube_user: "admin"
    calico_version: "v3.32.0"
    calico_interface: "enp0s8"

  tasks:

    - name: Проверить выбранный container runtime
      assert:
        that:
          - container_runtime in ['containerd', 'docker']
        fail_msg: "container_runtime должен быть containerd или docker."

    - name: Проверить наличие CRI socket выбранного runtime
      stat:
        path: "{{ cri_socket_path }}"
      register: cri_socket_file

    - name: Завершить с ошибкой, если CRI socket отсутствует
      fail:
        msg: "CRI socket {{ cri_socket_path }} для container_runtime={{ container_runtime }} не найден"
      when: not cri_socket_file.stat.exists

    - name: Проверить, инициализирован ли уже кластер
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Загрузить образы Kubernetes
      command: >
        kubeadm config images pull
        --cri-socket {{ cri_socket }}
      when: not k8s_admin_conf.stat.exists

    - name: Инициализировать первый управляющий узел
      command: >
        kubeadm init
        --control-plane-endpoint {{ control_plane_endpoint }}
        --upload-certs
        --pod-network-cidr {{ pod_network_cidr }}
        --service-cidr {{ service_cidr }}
        --cri-socket {{ cri_socket }}
      register: kubeadm_init
      when: not k8s_admin_conf.stat.exists

    - name: Ожидать готовности API-сервера
      command: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
      register: kubectl_result
      until: kubectl_result.rc == 0
      retries: 30
      delay: 5

    - name: Создать директорию конфигурации kubectl
      file:
        path: "/home/{{ kube_user }}/.kube"
        state: directory
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: "0755"

    - name: Скопировать admin kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ kube_user }}/.kube/config"
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: "0600"
        remote_src: true

    - name: Сгенерировать ключ сертификата
      shell: kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1
      register: certificate_key
      changed_when: false

    - name: Сгенерировать команду присоединения worker-узлов
      command: kubeadm token create --print-join-command
      register: worker_join_command
      changed_when: false

    - name: Сохранить скрипт присоединения worker-узлов
      copy:
        dest: /root/worker_join.sh
        mode: "0700"
        content: |
          #!/bin/bash
          {{ worker_join_command.stdout }} \
            --cri-socket {{ cri_socket }}

    - name: Сохранить скрипт присоединения управляющих узлов
      copy:
        dest: /root/controlplane_join.sh
        mode: "0700"
        content: |
          #!/bin/bash
          {{ worker_join_command.stdout }} \
            --control-plane \
            --certificate-key {{ certificate_key.stdout }} \
            --cri-socket {{ cri_socket }}

    - name: Установить оператор Calico
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        apply -f
        https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml

    - name: Ожидать регистрации CRD Installation
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get crd installations.operator.tigera.io
      register: crd_ready
      until: crd_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Применить конфигурацию Calico Installation
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f -
      args:
        stdin: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              nodeAddressAutodetectionV4:
                interface: {{ calico_interface }}
              ipPools:
                - blockSize: 26
                  cidr: {{ pod_network_cidr }}
                  encapsulation: VXLANCrossSubnet
                  natOutgoing: Enabled
                  nodeSelector: all()
          ---
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}

    - name: Ожидать перехода узла в состояние Ready
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        wait node --all
        --for=condition=Ready
        --timeout=600s
      changed_when: false
