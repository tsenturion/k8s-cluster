################################################################################
# Назначение:
#   Настройка keepalived VIP для HA control-plane в multinode кластере.
#
# Когда запускать:
#   Только в multinode сценарии после подготовки узлов и до kubeadm init первого
#   control-plane. Для single-master этот playbook не нужен.
#
# Что делает:
#   Устанавливает keepalived на master-узлы, рассчитывает MASTER/BACKUP priority,
#   создает health-check kube-apiserver и конфиг VRRP для virtual_ip.
#
# Важно:
#   VIP и интерфейс заданы в vars: virtual_ip=192.168.0.100, interface=enp0s8.
#   Они должны соответствовать netplan/VirtualBox сети. Неправильный VIP ломает
#   control-plane endpoint для HA-кластера.
################################################################################
---
- name: Keepalived VIP для Kubernetes Control Plane
  hosts: masters
  become: true

  vars:
    virtual_ip: "192.168.0.100"
    virtual_ip_mask: "24"
    keepalived_interface: "enp0s8"
    keepalived_auth_pass: "K8sHA2026VIP"

  tasks:
    - name: Установить keepalived
      apt:
        name:
          - keepalived
        state: present
        update_cache: true

    - name: Рассчитать приоритет узла
      set_fact:
        keepalived_priority: "{{ 200 - (groups['masters'].index(inventory_hostname) * 50) }}"
        keepalived_state: "{{ 'MASTER' if inventory_hostname == groups['masters'][0] else 'BACKUP' }}"

    - name: Создать скрипт проверки kube-apiserver
      copy:
        dest: /etc/keepalived/check_apiserver.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          curl -sk --max-time 5 https://127.0.0.1:6443/readyz -o /dev/null
          exit $?
      notify: restart keepalived

    - name: Создать конфигурацию keepalived
      copy:
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          global_defs {
              router_id {{ inventory_hostname }}
          }

          vrrp_script check_apiserver {
              script "/etc/keepalived/check_apiserver.sh"
              interval 3
              timeout 5
              weight -150
              fall 2
              rise 2
          }

          vrrp_instance VI_1 {
              state {{ keepalived_state }}
              interface {{ keepalived_interface }}
              virtual_router_id 51
              priority {{ keepalived_priority }}
              advert_int 1

              nopreempt

              authentication {
                  auth_type PASS
                  auth_pass {{ keepalived_auth_pass }}
              }

              virtual_ipaddress {
                  {{ virtual_ip }}/{{ virtual_ip_mask }}
              }

              track_script {
                  check_apiserver
              }

              track_interface {
                  {{ keepalived_interface }}
              }
          }
      notify: restart keepalived

    - name: Включить keepalived
      systemd:
        name: keepalived
        enabled: true
        state: started

    - name: Применить изменения
      meta: flush_handlers

  handlers:
    - name: restart keepalived
      systemd:
        name: keepalived
        state: restarted
