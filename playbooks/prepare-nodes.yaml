---
- name: Подготовка всех узлов к установке Kubernetes
  hosts: all
  become: yes
  tasks:

    - name: Отключить swap
      shell: swapoff -a

    - name: Убрать swap из fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '#\1'

    - name: Загрузить модули ядра (конфиг)
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Применить модули ядра
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Настроить параметры ядра
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables=1
          net.bridge.bridge-nf-call-ip6tables=1
          net.ipv4.ip_forward=1

    - name: Применить параметры ядра
      command: sysctl --system

    - name: Установить зависимости для apt
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Создать директорию для ключей apt
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Установить containerd
      apt:
        name: containerd
        state: present
        update_cache: yes

    - name: Создать директорию конфигурации containerd
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Сгенерировать конфигурацию containerd по умолчанию
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Включить SystemdCgroup в containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Перезапустить и включить containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Скачать GPG-ключ репозитория Kubernetes
      shell: >
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key
        | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Добавить репозиторий Kubernetes
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /
        mode: '0644'

    - name: Установить kubeadm
      apt:
        name: kubeadm
        state: present
        update_cache: yes

    - name: Установить kubelet
      apt:
        name: kubelet
        state: present

    - name: Установить kubectl
      apt:
        name: kubectl
        state: present

    - name: Зафиксировать версии пакетов Kubernetes
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Включить kubelet (без запуска — он стартует после kubeadm init/join)
      systemd:
        name: kubelet
        enabled: yes